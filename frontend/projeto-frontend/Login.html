<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Login.css">
</head>
<body>
    <main>
    <div class="topo">
        <div class="imagediv1">
        <div class="imagediv2">
    <div class="circulo" aria-hidden="true"></div>
    <picture class="image">
        <source srcset="images/foto.webp" type="image/webp">
        <img class="image" src="images/foto.jpeg" alt="" aria-hidden="true">
        </picture>
    </div>
    </div>
    <div class="logincampo">
    <h1>Faça o seu login</h1>
    <form id="formulario" aria-label="Formulário de login">
        <fieldset><legend class="visually-hidden">Dados Acadêmicos</legend>
    <label for="nome">Nome</label><input id="nome" name="nome" type="text" placeholder="Seu nome" required><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="Seu e-mail" required><label for="matricula">Matrícula</label><input id="matricula" name="matricula" type="number" placeholder="Sua matrícula" required></fieldset><button type="submit">Entrar</button>
    </form>
    </div>
</div>
    <div class="cadastro">
    <a href="Cadastro.html">Faça seu cadastro</a>
    </div>
</main>
</body>
<script src="Login.js"></script>
</html>
